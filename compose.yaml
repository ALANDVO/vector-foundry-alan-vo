# Vector Foundry - Docker Compose
# Development and production stack with Keycloak and PostgreSQL

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: vector-foundry-postgres
    environment:
      POSTGRES_DB: vector_foundry
      POSTGRES_USER: vector_foundry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector_foundry -d vector_foundry"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vector-foundry-network

  # Keycloak for OIDC authentication
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: vector-foundry-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-changeme}
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    volumes:
      - keycloak_data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - vector-foundry-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vector-foundry-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: sqlite+aiosqlite:///./data/vector_foundry.db
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: vector-foundry
      KEYCLOAK_CLIENT_ID: vector-foundry-frontend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/vector-foundry/.well-known/openid-configuration
      OIDC_ISSUER: http://keycloak:8080/realms/vector-foundry
      OIDC_AUDIENCE: vector-foundry-api
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_API_URL: https://api.github.com
      GITHUB_REPO_OWNER: rust-lang
      GITHUB_REPO_NAME: rust
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      CORS_ORIGINS: http://localhost:5173,http://localhost:80
      DEMO_MODE: ${DEMO_MODE:-false}
    volumes:
      - backend_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vector-foundry-network

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vector-foundry-frontend
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend
    networks:
      - vector-foundry-network

volumes:
  postgres_data:
  keycloak_data:
  backend_data:

networks:
  vector-foundry-network:
    driver: bridge
# Vector Foundry - CI Workflow
# Tests backend (pytest), frontend (npm ci/build/test), builds both Dockerfiles

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Run tests
        run: |
          .venv/bin/python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: backend
          ENVIRONMENT: test
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          KEYCLOAK_SERVER_URL: http://localhost:8080
          KEYCLOAK_REALM: vector-foundry
          KEYCLOAK_CLIENT_ID: vector-foundry-frontend
          KEYCLOAK_CLIENT_SECRET: ""
          OIDC_DISCOVERY_URL: ""
          OIDC_ISSUER: ""
          OIDC_AUDIENCE: vector-foundry-api
          GITHUB_TOKEN: ""
          LLM_API_KEY: ""
          SECRET_KEY: "test-secret"
          DEMO_MODE: "true"

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker-backend:
    name: Build Backend Docker
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          load: true

  docker-frontend:
    name: Build Frontend Docker
    runs-on: ubuntu-latest
    needs: frontend-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          load: true

  validate:
    name: Validate Portfolio
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, docker-backend, docker-frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          required_files=(
            "portfolio.json"
            "README.md"
            "LICENSE"
            "CHANGELOG.md"
            "pyproject.toml"
            ".gitignore"
            ".env.example"
            "compose.yaml"
            "backend/requirements.txt"
            "backend/Dockerfile"
            "backend/app/main.py"
            "frontend/package.json"
            "frontend/Dockerfile"
            ".github/workflows/ci.yml"
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done
          echo "All required files present"

      - name: Validate portfolio.json
        run: |
          python3 -c "
import json
with open('portfolio.json') as f:
    data = json.load(f)
assert data.get('schema_version') == 1
assert 'name' in data
assert 'owner' in data
assert 'email' in data
assert 'domain' in data
assert len(data.get('workflows', [])) >= 3
assert data.get('auth') == 'oidc-keycloak-saml-broker'
assert len(data.get('llm_providers', [])) >= 4
print('portfolio.json valid')
          "